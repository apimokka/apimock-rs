# Workspace root.
#
# # Why this file is workspace-only
#
# Until 5.1.0, the `apimock` façade package lived at the workspace root
# alongside the workspace definition itself. That worked but mixed two
# levels of concern in one file — workspace-wide settings *and* a single
# crate's package metadata — which is awkward when you want to read
# either level in isolation. 5.1.1 splits the façade out into
# `crates/apimock/`, leaving this file responsible only for:
#
# - listing workspace members
# - the `[workspace.package]` metadata that every member inherits
# - the `[workspace.dependencies]` table that pins shared external deps
# - workspace-wide build profiles (release size optimisation, dev
#   incremental, etc.)
#
# # Why we still ship `apimock` (façade) as a separate publishable crate
#
# `cargo install apimock` and `npx apimock` both depend on a crate
# literally named "apimock". Splitting the workspace into responsibility
# crates (config / routing / server) but folding their re-export into a
# façade keeps the install story simple — end users keep typing the
# same name.

[workspace]
resolver = "3"
members = [
    "crates/apimock",
    "crates/apimock-config",
    "crates/apimock-routing",
    "crates/apimock-server",
]

# Shared across every crate in the workspace so version / license / edition
# don't drift between the members.
[workspace.package]
version = "0.0.0-rfc081-test"
edition       = "2024"
rust-version  = "1.91.0"
license       = "Apache-2.0"
authors       = ["nabbisen"]
repository    = "https://github.com/apimokka/apimock-rs"
categories    = ["web-programming", "development-tools", "command-line-utilities"]
keywords      = ["http", "api", "mock", "testing"]

# Shared external deps. Each crate still lists its own dependency line but
# pulls the version from here to keep them in lockstep.
[workspace.dependencies]
# The three responsibility-split member crates. The façade re-exports
# their public surface and otherwise stays as thin as possible.
apimock-config              = { version = "0.0.0-rfc081-test", path = "crates/apimock-config" }
apimock-routing             = { version = "0.0.0-rfc081-test", path = "crates/apimock-routing" }
apimock-server              = { version = "0.0.0-rfc081-test", path = "crates/apimock-server" }

tokio                       = { version = "1.44", features = ["full"] }
hyper                       = { version = "1", features = ["server", "http1", "http2"] }
hyper-util                  = { version = "0", features = ["server", "http1", "http2", "tokio"] }
http-body-util              = "0"
rustls                      = { version = "0.23.43", default-features = false, features = ["log", "ring"] }
tokio-rustls                = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
rhai                        = { version = "1", features = ["sync", "serde"] }
toml                        = "1"
# Format-preserving sibling of `toml` above — same project, same TOML
# spec version. Used only by `apimock-config`'s save path (RFC 056) to
# mutate a parsed document in place instead of rebuilding one, so a
# save keeps the comments and key order a person wrote.
toml_edit                   = "0.25"
json5                       = "1"
csv                         = "1"
regex                       = "1"
globset                     = "0.4"
ignore                      = "0.4"
# `uuid` powers the stage-2 `NodeId`. Every editable node in a
# `Workspace` snapshot gets a v4 UUID so a GUI can track the node
# across moves / renames without relying on positional indices.
# `serde` feature so IDs serialise cleanly into `WorkspaceSnapshot`.
uuid                        = { version = "1", features = ["v4", "serde"] }
console                     = "0"
indexmap                    = { version = "2", features = ["serde"] }
log                         = "0"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
thiserror                   = "2"
anyhow                      = "1"
tempfile                    = "3"
# Dev-dependency only (RFC 060) — property-tests apimock-config's write
# path (Workspace::save). Shrinking on structured data is why this one
# and not quickcheck: a minimal reproducing config is the deliverable,
# not just "some input failed."
proptest                    = "1"

# Workspace-wide build profiles. Profile sections only take effect when
# specified in the root Cargo.toml of a workspace, regardless of which
# member is being built — so they live here, not in any individual
# crate's manifest.
[profile.release]     # shrink executable size
opt-level       = "z"
lto             = true
# panic = "abort"
strip           = true
codegen-units   = 1

[profile.dev]         # to reasonably improve productivity
opt-level       = 1         # slightly optimize
lto             = false     # disable link-time optimizations
# strip = "debuginfo"       # reduce size
incremental     = true
