[package]
name = "apimock"
version = "4.8.0"
edition = "2024"

description = "HTTP(S) mock server. Drop JSON files into a folder and your API immediately exists."
authors = ["nabbisen <nabbisen@scqr.net>"]
license = "Apache-2.0"

categories = ["web-programming", "development-tools", "command-line-utilities"]
keywords = ["http", "api", "mock", "testing"]
repository = "https://github.com/apimokka/apimock-rs"
readme = "README.md"
rust-version = "1.91.0"

[profile.release]     # shrink executable size
opt-level = "z"
lto = true
# panic = "abort"
strip = true
codegen-units = 1

[profile.dev]         # to reasonably improve productivity
opt-level = 1         # slightly optimize
lto = false           # disable link-time optimizations
# strip = "debuginfo" # reduce size
incremental = true

[features]
default = []
spawn = [] # offers another entry point for subprocess

[dependencies]
tokio = { version = "^1.44", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0", features = ["server", "http1", "http2", "tokio"] }
http-body-util = "0"

rustls = { version = "0.23.38", default-features = false, features = ["log", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }

log = "0"
console = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
json5 = "1"
csv = "1"
rhai = { version = "1", features = ["sync", "serde"] }
# Error handling: `thiserror` provides the derive for our structured `AppError`
# enum (see `core::error`), and `anyhow` is used at the process boundary
# (binary entry point) where we want to flatten any error source into a single
# printable value without pattern-matching on the variant.
thiserror = "2"
anyhow = "1"

[dev-dependencies]
rand = "^0"
reqwest = { version = "0", default-features = false, features = ["rustls-tls"] }
rcgen = "^0"
local-ip-address = "^0"
# Scratch-dir helper for benches that write rule-set TOML to disk.
tempfile = "3"
# `log` is already a runtime dep without the `std` feature; benches and
# examples need the `std` feature so they can install their own logger
# (bench_load uses `log::set_boxed_logger` to silence server-side
# request logs that would otherwise pollute the CSV output stream).
log = { version = "0", features = ["std"] }
# Benchmarking: criterion 0.8 for latency/throughput microbenchmarks
# (see `benches/`), with async_tokio so HTTP benchmarks can drive the
# real server. MSRV for criterion 0.8 is 1.88 — well below our 1.91.
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# Custom harnesses: each bench file sets `harness = false` so cargo uses
# criterion's runner (via `criterion_main!`) instead of libtest. Keeping
# the two benches separate means `cargo bench --bench routing` runs the
# fast pure-CPU benches without waiting for the HTTP server to spin up.
[[bench]]
name = "routing"
harness = false

[[bench]]
name = "response_latency"
harness = false
