name: Release

# The 4.x line's release workflow: it **builds** the platform binaries,
# attaches them to the Release, and **publishes** to npm and crates.io —
# all in one run, which is why the npm jobs can use `download-artifact`
# rather than pulling archives back off the Release the way the 5.x/6.x
# line has to.
#
# **The filename is load-bearing.** Trusted-publishing records on npm and
# crates.io bind to repository + workflow *filename*, per package. This
# file is called `release-publish.yaml` to match the 5.x/6.x line's
# publish workflow, so a single record per package covers both lines and
# nothing has to be repointed per release. It was `release-executable.yaml`
# until 2026-08-26; that mismatch is what blocked the 4.8.1 security
# release on both registries. Renaming this file breaks 4.x publishing.
#
# `name:` says "Release", not "Release publish", deliberately — RFC 044
# rejected letting a workflow's name drift from what it actually does,
# and this one builds as well as publishes. The filename is constrained
# by the registries; the display name is not, so it stays accurate.

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  PRODUCT_BASENAME: apimock
  TAG: ${{ github.ref_name }}            # tag or branch name
  JOB_WORKDIR: tmp-${{ github.run_id }}  # unique number

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: Linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: Linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin-ext:
            archive-ext: .zip
          - name: Windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # [ build ]
      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable ${{ matrix.target }}
      
      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust executable
        run: |
          cargo build --release --target ${{ matrix.target }} --bin ${{ env.PRODUCT_BASENAME }} --locked
      
      # [ release asset ]
      - name: Prepare for release asset
        run: |
          BUILT_FILE_PATH=target/${{ matrix.target }}/release/${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}
          RELEASE_ASSET_BASENAME=${{ env.PRODUCT_BASENAME }}@${{ matrix.name }}-${{ env.TAG }}
          RELEASE_SRC_DIR=${RELEASE_ASSET_BASENAME}
          RELEASE_ASSET_FILENAME=${RELEASE_ASSET_BASENAME}${{ matrix.archive-ext }}
          
          mkdir -p "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}"

          cp "examples/config/default/apimock.toml" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "examples/config/default/apimock-rule-set.toml" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "examples/config/default/apimock-middleware.rhai" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "${BUILT_FILE_PATH}" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          
          echo "RELEASE_SRC_DIR=${RELEASE_SRC_DIR}" >> $GITHUB_ENV
          echo "RELEASE_ASSET_FILENAME=${RELEASE_ASSET_FILENAME}" >> $GITHUB_ENV

      # BSD tar on macOS: first 8MB of the file are sometimes all NUL byte
      # refs: https://github.com/actions/cache/issues/403 , https://github.com/rust-lang/cargo/issues/8603
      - name: Mitigate macOS tar bug
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          sudo /usr/sbin/purge
      
      - name: Create archive as release asset - Linux
        if: >
          matrix.target != 'aarch64-apple-darwin' &&
          matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          tar czf "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"
      
      - name: Create archive as release asset - Windows / macOS
        if: >
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          7z a "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"
      
      - name: Update release with new asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} ${RELEASE_ASSET_FILENAME}

      # [ artifact passed to next workflow(s) ]
      - name: Upload built binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_BASENAME }}-${{ matrix.name }}-${{ env.TAG }}
          path: target/${{ matrix.target }}/release/${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}
  
  npm-platforms-publish:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        include:
          # - name: Linux-aarch64-musl
          #   target: aarch64-unknown-linux-musl
          #   os: ubuntu-latest
          - name: Linux-x64-gnu
            npm-target: linux-x64-gnu
            os: ubuntu-latest
          # - name: Linux-x64-musl
          #   target: x86_64-unknown-linux-musl
          #   os: ubuntu-latest
          - name: macOS-aarch64
            npm-target: darwin-arm64
            os: macos-latest
          - name: Windows-x64
            npm-target: win32-x64-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      
      - name: Download built binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PRODUCT_BASENAME }}-${{ matrix.name }}-${{ env.TAG }}
          path: npm/${{ matrix.npm-target }}
      
      - name: npm publish
        working-directory: npm/${{ matrix.npm-target }}
        run: |
          npm install --package-lock-only
          npm ci
          # `--tag v4x`: npm refuses to move the `latest` dist-tag backwards,
          # and 5.19.1 is already published. Without a tag, publishing any
          # 4.x version fails with "Cannot implicitly apply the 'latest'
          # tag because previously published version ... is higher".
          # v4 is a live, supported line alongside v5/v6, so it gets its own
          # dist-tag rather than claiming `latest`. Install with
          # `npm install apimock-rs@v4x`.
          #
          # `v4x`, not `v4`: npm rejects a dist-tag that parses as a semver
          # range, and `v4` is one (`>=4.0.0 <5.0.0-0`) — it fails with
          # "Tag name must not be a valid SemVer range: v4". `v4x` is not a
          # range. Avoided `legacy`/`lts`: v4 is supported, and neither
          # word should imply a policy this project has not stated.
          npm publish --tag v4x

  npm-core-publish:
    runs-on: ubuntu-latest
    needs: npm-platforms-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      
      - name: npm publish
        working-directory: npm
        run: |
          cp -f ../README.md .
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          # `--tag v4x`: npm refuses to move the `latest` dist-tag backwards,
          # and 5.19.1 is already published. Without a tag, publishing any
          # 4.x version fails with "Cannot implicitly apply the 'latest'
          # tag because previously published version ... is higher".
          # v4 is a live, supported line alongside v5/v6, so it gets its own
          # dist-tag rather than claiming `latest`. Install with
          # `npm install apimock-rs@v4x`.
          #
          # `v4x`, not `v4`: npm rejects a dist-tag that parses as a semver
          # range, and `v4` is one (`>=4.0.0 <5.0.0-0`) — it fails with
          # "Tag name must not be a valid SemVer range: v4". `v4x` is not a
          # range. Avoided `legacy`/`lts`: v4 is supported, and neither
          # word should imply a policy this project has not stated.
          npm publish --tag v4x

  # crates.io publish for the v4 line.
  #
  # v4 originally had no crates.io job at all — that half of a v4 release
  # was done by hand. That stopped working once *"Require trusted
  # publishing for all new versions"* was enabled on the `apimock` crate:
  # a token-authenticated `cargo publish` now returns
  #
  #   403 Forbidden: New versions of this crate can only be published
  #   using Trusted Publishing
  #
  # The tempting workaround is to switch that requirement off, publish,
  # and switch it back on (RELEASING.md documents it). This job is the
  # better answer: it keeps the requirement on permanently and satisfies
  # it, exchanging this workflow's OIDC identity for a short-lived token
  # via `crates-io-auth-action` — the same mechanism the 5.x line uses in
  # release-publish.yaml. No stored secret, no token window.
  #
  # Publisher records bind to repository + workflow **filename**, per
  # package/crate. This file is named `release-publish.yaml` — matching
  # the 5.x/6.x line's publish workflow — precisely so one record per
  # package covers both lines and nothing has to be repointed per
  # release. Renaming this file breaks publishing on the 4.x line; that
  # mismatch is what caused the v5.16.0 npm E404 and cost three
  # releases before it was understood. See RELEASING.md.
  #
  # `cargo publish`, not `--workspace`: v4 is a single crate.
  crates-io-publish:
    runs-on: ubuntu-latest
    needs: npm-core-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --locked: this release's Cargo.lock was hand-corrected after
        # version.sh's refresh pruned `rand` and broke the test build.
        # Publish it as committed rather than re-resolving.
        run: cargo publish --locked
