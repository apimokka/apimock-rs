name: Release publish

# Publish phase (RFC 044 § Amendment A3). Triggered only by a Release
# transitioning to published — never by a tag push. That is a structural
# fact, not a convention: this file's `on:` block has no `push:` trigger
# at all, so there is no job here a tag push could reach, `if:` or no
# `if:`. The build phase (release-executable.yaml) creates the draft this
# workflow reacts to and attaches every asset to it before a human ever
# sees it; clicking "Publish" on that draft is what fires this file.
#
# `created` was considered and rejected — see RFC 044 § Amendment A1 and
# this repository's review-request package for RFC 044, which records
# the verification against current GitHub documentation. `published` is
# used specifically because it is unambiguous: it fires once, when a
# release actually goes live, never on a draft being saved or edited.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  PRODUCT_BASENAME: apimock
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # RFC 044 § 4.3: the build phase and this phase are two separate
  # workflow runs (two different trigger events), so `actions/upload-
  # artifact` / `actions/download-artifact` cannot carry binaries between
  # them - artifacts are scoped to the run that produced them. Rather
  # than reach across runs by `run-id` (fragile - depends on locating the
  # right build run for this tag) or rebuild from source here (wasteful,
  # and could publish a binary that differs from the one already
  # attached to the Release), this phase downloads the exact archives the
  # build phase attached to the draft and extracts the binary from each.
  # Those archives are what a human just reviewed and approved by
  # clicking Publish, which makes this the more correct source, not
  # merely the more convenient one.
  npm-platforms-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux-x64-gnu
            npm-target: linux-x64-gnu
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: macOS-aarch64
            npm-target: darwin-arm64
            os: macos-latest
            bin-ext:
            archive-ext: .zip
          - name: Windows-x64
            npm-target: win32-x64-msvc
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Download and extract release binary
        uses: ./.github/actions/extract-release-binary
        with:
          tag: ${{ env.TAG }}
          product-basename: ${{ env.PRODUCT_BASENAME }}
          platform-name: ${{ matrix.name }}
          archive-ext: ${{ matrix.archive-ext }}
          bin-ext: ${{ matrix.bin-ext }}
          dest-dir: npm/${{ matrix.npm-target }}

      - name: npm publish
        working-directory: npm/${{ matrix.npm-target }}
        run: |
          npm install --package-lock-only
          npm ci
          npm publish

  # RFC 066 Amendment 2: a wait that changes nothing about what
  # publishes, in what order, or with what credentials - the carve-out
  # this job's fix sits inside, and nothing else.
  #
  # 6.0.0 failed here: `npm install --package-lock-only` ran with no
  # wait of any kind right after `npm-platforms-publish` reported
  # success, and npm silently omits an `optionalDependencies` entry it
  # cannot yet resolve - so the generated lock was missing all three
  # platform packages, and `npm ci` then rejected it against a
  # `package.json` that declares them. The gap between the last
  # platform publish completing and this job starting has been as low
  # as 2 seconds on a real release (`RELEASING.md`'s "npm publish
  # order" section has the measured history) - the eight prior
  # successes were the race being won, not absent.
  npm-core-publish:
    runs-on: ubuntu-latest
    needs: npm-platforms-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Wait for platform packages to propagate
        run: |
          bash .github/workflows/scripts/wait-for-npm-propagation.sh \
            "${{ env.TAG }}" \
            "@apimock-rs/bin-linux-x64-gnu" \
            "@apimock-rs/bin-darwin-arm64" \
            "@apimock-rs/bin-win32-x64-msvc"

      - name: npm publish
        working-directory: npm
        run: |
          cp -f ../README.md .
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm publish

  # RFC 044 § A5: cargo resolves the workspace's dependency order itself
  # and waits for each crate to be available on the index before
  # publishing the next - the exact behaviour the deleted `cargo-
  # publish.sh` never had. One command replaces what the RFC's original
  # design treated as ordering/propagation/idempotency logic to build.
  #
  # Runs after the npm jobs, matching RFC 044's own dependency diagram
  # (build -> npm publish -> crates.io publish) rather than in parallel -
  # the RFC draws this ordering deliberately and this implementation
  # follows it rather than optimising for concurrency it didn't ask for.
  #
  # Credentials: crates.io Trusted Publishing (OIDC), the same class of
  # mechanism already used for npm above, via the same `id-token: write`
  # permission this file already declares for that job. This requires
  # crates.io's own project settings to have Trusted Publishing enabled
  # for each of the four workspace crates - a registry-side configuration
  # this repository cannot express and this implementation cannot verify
  # (RFC 044 Unresolved question 2). If it is not enabled, this job fails
  # with an authentication error rather than silently falling back to
  # anything - see the review-request package for what was and wasn't
  # verifiable here.
  crates-io-publish:
    runs-on: ubuntu-latest
    needs: npm-core-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace

  # RFC 047: a green publish job proves an upload succeeded, not that the
  # right bytes arrived - npm shipped 5.9.0-5.10.0 packages containing a
  # 4.6.9 binary for months with every job green. This is the check that
  # would have caught it: pull the artifact back from each registry and
  # compare it, byte for byte, against the Release asset a human already
  # reviewed. `needs:` the publish jobs so this only ever runs after -
  # never gates, never blocks, and by the time it runs the artifact is
  # already public either way. Read-only and unauthenticated throughout
  # (`contents: read` only): `npm pack` of a public package needs no
  # auth, and `gh release download` needs only read access to this repo.
  verify-published:
    needs: [npm-platforms-publish, npm-core-publish]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      # A verification job wants every platform's answer, not the first
      # failure. v5.17.0's run made the case: the macOS leg failed,
      # fail-fast cancelled Linux and Windows, and the result read as a
      # macOS-specific problem when in fact all three would have failed
      # identically. Cancelling siblings costs information exactly where
      # information is the whole point of the job.
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-gnu
            npm-target: linux-x64-gnu
            npm-package: '@apimock-rs/bin-linux-x64-gnu'
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: macOS-aarch64
            npm-target: darwin-arm64
            npm-package: '@apimock-rs/bin-darwin-arm64'
            os: macos-latest
            bin-ext:
            archive-ext: .zip
          - name: Windows-x64
            npm-target: win32-x64-msvc
            npm-package: '@apimock-rs/bin-win32-x64-msvc'
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download and extract Release asset binary
        uses: ./.github/actions/extract-release-binary
        with:
          tag: ${{ env.TAG }}
          product-basename: ${{ env.PRODUCT_BASENAME }}
          platform-name: ${{ matrix.name }}
          archive-ext: ${{ matrix.archive-ext }}
          bin-ext: ${{ matrix.bin-ext }}
          dest-dir: release-asset

      # Registries are not instantly consistent right after `npm
      # publish` returns. 6 attempts x 15s = 90s of headroom before this
      # is treated as a real failure rather than propagation lag - long
      # enough that a false failure here should be rare (npm's own
      # documented behaviour is near-immediate consistency for direct
      # version fetches; this is headroom for the rare case, not the
      # expected wait), short enough that a genuine problem is reported
      # in under two minutes, not left to time out silently.
      - name: npm pack (public, unauthenticated)
        run: |
          # `--pack-destination` does not create the directory; npm fails
          # with ENOENT trying to write the tarball into it. v5.17.0's
          # run failed here on every platform (only macOS was observed —
          # fail-fast cancelled the rest), reproduced identically on
          # Linux locally. The sibling step below creates its own
          # directory; this one never did.
          mkdir -p npm-pack-out

          for attempt in 1 2 3 4 5 6; do
            if npm pack "${{ matrix.npm-package }}@${{ env.TAG }}" --pack-destination npm-pack-out; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::npm pack failed for ${{ matrix.npm-package }}@${{ env.TAG }} after 6 attempts over 90s"
              exit 1
            fi
            echo "npm pack attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Extract npm package
        # npm tarballs are always gzipped tar, on every platform - unlike
        # the Release assets (extracted via the composite action above,
        # which uses 7z for the two platforms that ship .zip). This is
        # the first place in this repository `tar` runs on
        # windows-latest rather than 7z. Considered and expected to
        # work - `tar` ships in the Git Bash environment these runners
        # use - but unlike 7z-on-Windows (proven across the real v5.15.0
        # and v5.16.0 releases via npm-platforms-publish), this specific
        # combination has not executed for real before this RFC.
        run: |
          mkdir -p npm-pack-extracted
          tar xzf npm-pack-out/*.tgz -C npm-pack-extracted

      - name: Compare binaries by hash
        run: |
          # sha256sum is GNU coreutils and does not ship on macOS's base
          # system (no GNU coreutils on macos-latest images by default).
          # openssl is present on all three runner OSes we matrix over
          # here (ubuntu-latest, macos-latest, windows-latest via Git
          # Bash) with no branching needed - reasoned about for exactly
          # those three, not verified beyond them.
          sha256_of() { openssl dgst -sha256 "$1" | awk '{print $NF}'; }

          BINARY_NAME="${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}"
          RELEASE_BINARY="release-asset/${BINARY_NAME}"
          NPM_BINARY="npm-pack-extracted/package/${BINARY_NAME}"

          if [ ! -f "$NPM_BINARY" ]; then
            echo "::error::npm package ${{ matrix.npm-package }}@${{ env.TAG }} does not contain $BINARY_NAME at the expected path"
            exit 1
          fi

          RELEASE_HASH=$(sha256_of "$RELEASE_BINARY")
          NPM_HASH=$(sha256_of "$NPM_BINARY")

          echo "release asset : $RELEASE_HASH  ($RELEASE_BINARY)"
          echo "npm package   : $NPM_HASH  ($NPM_BINARY)"

          if [ "$RELEASE_HASH" != "$NPM_HASH" ]; then
            echo "::error::binary mismatch for ${{ matrix.npm-package }}@${{ env.TAG }} — release asset sha256=$RELEASE_HASH ($RELEASE_BINARY) vs npm package sha256=$NPM_HASH ($NPM_BINARY)"
            exit 1
          fi

          echo "OK: ${{ matrix.npm-package }}@${{ env.TAG }} binary matches the Release asset ($RELEASE_HASH)"

  # RFC 047 Goal 2: crates.io resolving the released version is a
  # different claim than "cargo publish exited 0" - this asserts the
  # former, against the registry's own public API, with no credential.
  verify-crates-io:
    needs: crates-io-publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [apimock, apimock-config, apimock-routing, apimock-server]
    steps:
      - name: Assert crates.io serves the released version
        run: |
          # crates.io's API data-access policy rejects requests with no
          # identifying User-Agent - a bare curl default gets a 403, not
          # the crate data. Confirmed locally: this call 403s without
          # the header below and succeeds with it.
          for attempt in 1 2 3 4 5 6; do
            RESPONSE=$(curl -sf \
              -H "User-Agent: apimock-rs-release-verify (https://github.com/apimokka/apimock-rs)" \
              "https://crates.io/api/v1/crates/${{ matrix.crate }}" || true)
            if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq -e --arg v "${{ env.TAG }}" \
              '.versions // [] | any(.num == $v)' > /dev/null 2>&1; then
              echo "OK: ${{ matrix.crate }} ${{ env.TAG }} is live on crates.io"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::crates.io does not serve ${{ matrix.crate }}@${{ env.TAG }} after 6 attempts over 90s"
              exit 1
            fi
            echo "attempt $attempt: ${{ matrix.crate }}@${{ env.TAG }} not yet visible on crates.io, retrying in 15s..."
            sleep 15
          done
