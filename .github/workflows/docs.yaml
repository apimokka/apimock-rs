name: Docs

on:
  push:
    branches:
      - main
  # manual run
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

defaults:
  run:
    shell: bash

env:
  PRODUCT_BASENAME: apimock
  TAG: ${{ github.ref_name }}            # tag or branch name
  JOB_WORKDIR: tmp-${{ github.run_id }}  # unique number

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      # Post-6.0.0 docs-integrity handoff § 3: this used to resolve
      # "latest" via an unauthenticated api.github.com call, which
      # rate-limited during unrelated work and failed a required job
      # for a reason invisible in the diff. Pinned instead — removes
      # the API call entirely (a release-asset download URL isn't
      # subject to the REST API's rate limit) and makes the build
      # reproducible, which resolving "latest" every run prevented.
      # `ci.yaml` carries the identical step; bump both together.
      - name: Install mdBook and extension(s)
        env:
          MDBOOK_VERSION: 0.5.4
          MDBOOK_MERMAID_VERSION: 0.17.1
        run: |
          curl -sL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/
          curl -sL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook-mermaid /usr/local/bin/
      
      - name: mdbook build
        working-directory: docs
        run: |
          mdbook build
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
