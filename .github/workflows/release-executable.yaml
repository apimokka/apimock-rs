name: Executable

# Build phase (RFC 044 § Amendment A3). Triggered by the tag push alone —
# the only human action in the whole release flow. Everything here is
# invisible to the outside world: it creates a DRAFT Release and attaches
# assets to it, but publishes nothing. The publish phase lives in
# release-publish.yaml and only starts once a human clicks "Publish" on
# the draft this workflow produces — see that file for why the trigger
# split is a hard boundary (two files, two `on:` blocks) rather than an
# `if:` condition inside one file.
on:
  push:
    # `*.*.*` deliberately, not a `[0-9]`-style character class: GitHub's
    # documented tag-glob special characters are `* ** + ? !` only,
    # brackets are not among them. This is a coarse filter, not the
    # correctness check - a tag that isn't a clean X.Y.Z still gets
    # rejected below, by version-consistency-check's exact string
    # comparison against [workspace.package].version.
    tags: ['*.*.*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PRODUCT_BASENAME: apimock
  TAG: ${{ github.ref_name }}            # tag name, e.g. 5.16.0
  JOB_WORKDIR: tmp-${{ github.run_id }}  # unique number

jobs:
  # RFC 032: fail the release before any asset is built or published if
  # the release tag, the workspace manifest, and the npm package files
  # disagree on version. Without this, a stale npm version was only
  # discovered at the very last job (npm-core-publish), after the Rust
  # release assets had already been uploaded to the GitHub release.
  version-consistency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag, workspace manifest, and npm versions agree
        run: |
          WORKSPACE_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)

          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::Could not read [workspace.package].version from Cargo.toml"
            exit 1
          fi

          echo "Release tag:        ${{ env.TAG }}"
          echo "Workspace version:  $WORKSPACE_VERSION"

          FAIL=0

          if [ "${{ env.TAG }}" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Release tag (${{ env.TAG }}) does not match [workspace.package].version ($WORKSPACE_VERSION)"
            FAIL=1
          fi

          for f in npm/package.json npm/darwin-arm64/package.json npm/linux-x64-gnu/package.json npm/win32-x64-msvc/package.json; do
            V=$(jq -r '.version' "$f")
            if [ "$V" != "$WORKSPACE_VERSION" ]; then
              echo "::error::$f version ($V) does not match workspace version ($WORKSPACE_VERSION)"
              FAIL=1
            fi
          done

          PINS=$(jq -r '.optionalDependencies // {} | to_entries[] | "\(.key)=\(.value)"' npm/package.json)
          for pin in $PINS; do
            name=${pin%%=*}
            v=${pin#*=}
            if [ "$v" != "$WORKSPACE_VERSION" ]; then
              echo "::error::npm/package.json optionalDependencies[$name] ($v) does not match workspace version ($WORKSPACE_VERSION)"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "All versions agree: $WORKSPACE_VERSION"

  # RFC 031: re-run the same format/lint/test gates ci.yaml runs on every
  # push and pull request, at release time too. `workflow_run` triggers
  # fire after the fact and can't block a release already in progress,
  # and a release is triggered by a tag push — not something branch
  # protection on pull requests covers. So the gate is duplicated here,
  # deliberately, rather than relied on having already passed at some
  # earlier point. This guarantees the artifact was built from a tree
  # that was actually green at release time.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # RFC 044 § A2/A3: create the Release as a DRAFT, before any asset
  # exists. A draft is not visible to anyone outside the repository's
  # write-access list, so this creates nothing public. Release notes come
  # from CHANGELOG.md rather than being retyped; a missing section fails
  # the job rather than shipping an empty-notes Release (§ 4.4).
  create-draft-release:
    needs: [version-consistency-check, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        run: |
          bash .github/workflows/scripts/extract-changelog-section.sh "${{ env.TAG }}" CHANGELOG.md > release-notes.md

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG }}" \
            --draft \
            --title "${{ env.TAG }}" \
            --notes-file release-notes.md

  build:
    needs: [create-draft-release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: Linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: Linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin-ext:
            archive-ext: .zip
          - name: Windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # [ build ]
      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable ${{ matrix.target }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust executable
        run: |
          cargo build --release --target ${{ matrix.target }} --bin ${{ env.PRODUCT_BASENAME }} --locked

      # [ release asset ]
      - name: Prepare for release asset
        run: |
          BUILT_FILE_PATH=target/${{ matrix.target }}/release/${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}
          RELEASE_ASSET_BASENAME=${{ env.PRODUCT_BASENAME }}@${{ matrix.name }}-${{ env.TAG }}
          RELEASE_SRC_DIR=${RELEASE_ASSET_BASENAME}
          RELEASE_ASSET_FILENAME=${RELEASE_ASSET_BASENAME}${{ matrix.archive-ext }}

          mkdir -p "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}"

          cp "crates/apimock/examples/config/default/apimock.toml" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "crates/apimock/examples/config/default/apimock-rule-set.toml" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "crates/apimock/examples/config/default/apimock-middleware.rhai" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"
          cp "${BUILT_FILE_PATH}" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"

          echo "RELEASE_SRC_DIR=${RELEASE_SRC_DIR}" >> $GITHUB_ENV
          echo "RELEASE_ASSET_FILENAME=${RELEASE_ASSET_FILENAME}" >> $GITHUB_ENV

      # BSD tar on macOS: first 8MB of the file are sometimes all NUL byte
      # refs: https://github.com/actions/cache/issues/403 , https://github.com/rust-lang/cargo/issues/8603
      - name: Mitigate macOS tar bug
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          sudo /usr/sbin/purge

      - name: Create archive as release asset - Linux
        if: >
          matrix.target != 'aarch64-apple-darwin' &&
          matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          tar czf "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"

      - name: Create archive as release asset - Windows / macOS
        if: >
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          7z a "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"

      - name: Upload asset to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ env.TAG }} ${RELEASE_ASSET_FILENAME}
