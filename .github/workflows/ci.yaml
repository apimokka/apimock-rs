name: CI

on:
  push:
    # `release/*` matters: v5.19.0 was cut from a branch off the 5.18.0
    # tag (RFC 054), and with `main` alone here that branch had **no CI
    # at all**. The gap was invisible — `gh run list` happily showed a
    # green run, which belonged to `main` at an unrelated commit. Any
    # future branch-cut release gets covered automatically rather than
    # depending on someone noticing which branch a green tick came from.
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:
  # RFC 033: advisories are published against code that hasn't changed,
  # so a check that only runs on push/PR will never see them. Only the
  # `audit` job runs on this trigger — every other job is gated with
  # `if: github.event_name != 'schedule'` so a scheduled run doesn't
  # needlessly re-run fmt/clippy/test/msrv/lockfile on an unchanged tree.
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name != 'schedule'
    strategy:
      # RFC 061: one platform failing must not cancel the others and
      # hide whether they pass -- the same reason RFC 047 needed this
      # for its own matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Read the pin rather than hardcode it, so a deliberate edit to
      # [workspace.package].rust-version in Cargo.toml is what this job
      # follows — not a second copy of the version that can drift from it.
      - name: Read pinned rust-version
        id: msrv
        run: |
          MSRV=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^[[:space:]]*rust-version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$MSRV" ]; then
            echo "::error::Could not read [workspace.package].rust-version from Cargo.toml"
            exit 1
          fi
          echo "Pinned MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install pinned MSRV toolchain
        run: bash .github/workflows/scripts/install-rust.sh ${{ steps.msrv.outputs.version }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-

      # No tests here: dev-dependencies may legitimately require a newer
      # toolchain than the library itself needs to build and check clean.
      - name: cargo check --workspace (MSRV)
        run: cargo check --workspace

  # RFC 033: known-vulnerability audit against the RustSec advisory
  # database, over the committed Cargo.lock. Runs on push/PR/dispatch
  # *and* the weekly schedule above — advisories are published against
  # unchanged code, so this is the one job that must not be excluded
  # from the schedule trigger.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cached separately from the project's own dependency cache above:
      # cargo-audit's binary doesn't depend on this repo's Cargo.lock, so
      # keying it on that would invalidate it every time the lockfile
      # changes for reasons that have nothing to do with cargo-audit
      # itself.
      - name: Cache cargo-audit binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # RFC 033: fails if Cargo.lock doesn't reflect what the manifests
  # currently require -- e.g. a Cargo.toml edit that forgot to
  # regenerate the lockfile. Verified locally that this is NOT the same
  # as "a newer compatible version was published": `cargo update
  # --locked` exits 0 even when dependencies sit behind their latest
  # available version, so this check's result cannot change without a
  # commit to this repo. Unlike `audit`, a weekly re-run would be a
  # guaranteed no-op -- excluded from the schedule trigger for that
  # reason, not merely for symmetry with fmt/clippy/test/msrv.
  lockfile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo update --workspace --locked
        run: cargo update --workspace --locked
