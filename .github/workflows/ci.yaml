name: CI

on:
  push:
    # `release/*` matters: v5.19.0 was cut from a branch off the 5.18.0
    # tag (RFC 054), and with `main` alone here that branch had **no CI
    # at all**. The gap was invisible — `gh run list` happily showed a
    # green run, which belonged to `main` at an unrelated commit. Any
    # future branch-cut release gets covered automatically rather than
    # depending on someone noticing which branch a green tick came from.
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:
  # RFC 033: advisories are published against code that hasn't changed,
  # so a check that only runs on push/PR will never see them. Only the
  # `audit` job runs on this trigger — every other job is gated with
  # `if: github.event_name != 'schedule'` so a scheduled run doesn't
  # needlessly re-run fmt/clippy/test/msrv/lockfile on an unchanged tree.
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name != 'schedule'
    strategy:
      # RFC 061: one platform failing must not cancel the others and
      # hide whether they pass -- the same reason RFC 047 needed this
      # for its own matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Read the pin rather than hardcode it, so a deliberate edit to
      # [workspace.package].rust-version in Cargo.toml is what this job
      # follows — not a second copy of the version that can drift from it.
      - name: Read pinned rust-version
        id: msrv
        run: |
          MSRV=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^[[:space:]]*rust-version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$MSRV" ]; then
            echo "::error::Could not read [workspace.package].rust-version from Cargo.toml"
            exit 1
          fi
          echo "Pinned MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install pinned MSRV toolchain
        run: bash .github/workflows/scripts/install-rust.sh ${{ steps.msrv.outputs.version }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-

      # No tests here: dev-dependencies may legitimately require a newer
      # toolchain than the library itself needs to build and check clean.
      - name: cargo check --workspace (MSRV)
        run: cargo check --workspace

  # RFC 033: known-vulnerability audit against the RustSec advisory
  # database, over the committed Cargo.lock. Runs on push/PR/dispatch
  # *and* the weekly schedule above — advisories are published against
  # unchanged code, so this is the one job that must not be excluded
  # from the schedule trigger.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cached separately from the project's own dependency cache above:
      # cargo-audit's binary doesn't depend on this repo's Cargo.lock, so
      # keying it on that would invalidate it every time the lockfile
      # changes for reasons that have nothing to do with cargo-audit
      # itself.
      - name: Cache cargo-audit binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # RFC 033: fails if Cargo.lock doesn't reflect what the manifests
  # currently require -- e.g. a Cargo.toml edit that forgot to
  # regenerate the lockfile. Verified locally that this is NOT the same
  # as "a newer compatible version was published": `cargo update
  # --locked` exits 0 even when dependencies sit behind their latest
  # available version, so this check's result cannot change without a
  # commit to this repo. Unlike `audit`, a weekly re-run would be a
  # guaranteed no-op -- excluded from the schedule trigger for that
  # reason, not merely for symmetry with fmt/clippy/test/msrv.
  lockfile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo update --workspace --locked
        run: cargo update --workspace --locked

  # Post-6.0.0 release-process audit § 3: nothing ran `cargo package`
  # before this, so a packaging problem (an excluded file a crate needs,
  # a manifest error) only ever surfaced during `cargo publish`, after
  # the tag and the draft Release — the same "discovered during a live
  # release" class the npm propagation-wait section of `RELEASING.md`
  # documents for a different job.
  #
  # Gated on the workspace version not already being on crates.io -
  # this is load-bearing, not defensive filler, and was found the hard
  # way. A first version of this job ran `cargo package --workspace`
  # unconditionally, on the reasoning that `--workspace` mode verifies
  # each crate against the *other tarballs this same command just
  # packaged* (cargo's co-packaging temp registry) rather than against
  # crates.io. True for a crate with no workspace-internal dependency
  # (confirmed by deliberately breaking `apimock-routing` itself with a
  # `compile_error!` and watching its own verification fail) - false
  # for one that depends on a sibling crate still at an *already
  # published* version: `apimock-config` depends on `apimock-routing`,
  # and once that exact version string exists on crates.io, cargo
  # resolves it from there instead of from the sibling tarball just
  # packaged alongside it. Reproduced by adding a `pub fn` to
  # `apimock-routing` and calling it from `apimock-config` with the
  # version left at the already-published `6.0.0`: verification failed
  # with "cannot find function" against the *published* crate, proving
  # the unconditional job would turn red on the first ordinary
  # cross-crate change after any release and stay red until the next
  # one - reverted before committing. So: check whether the current
  # `apimock` version (all four crates are always bumped together, so
  # one is representative) is already live on crates.io first, and
  # only run the real packaging build when it is not - true exactly on
  # the release path, between `version.sh --update` and the tag, which
  # is the one place this gate needs to fire.
  #
  # Fails open toward *skipping*, not running, when the crates.io query
  # itself is inconclusive (network hiccup, rate limit, non-2xx) -
  # deliberately, since this job runs on every ordinary push and a
  # false positive here (the exact failure mode above) is worse than an
  # occasional missed check that the very next push re-attempts. No
  # retry loop: unlike `verify-published`/`verify-crates-io` (checking
  # whether something *just* published has propagated), this checks a
  # stable historical fact - it either already answers correctly on the
  # first try or the failure-open default handles it.
  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read workspace version
        id: version
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read [workspace.package].version from Cargo.toml"
            exit 1
          fi
          echo "Workspace version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on crates.io
        id: published
        run: |
          # Same User-Agent convention as release-publish.yaml's
          # verify-crates-io - crates.io's API rejects an unidentified
          # request. `apimock` stands in for all four crates (always
          # bumped together by version.sh).
          RESPONSE=$(curl -sf \
            -H "User-Agent: apimock-rs-ci-package-gate (https://github.com/apimokka/apimock-rs)" \
            "https://crates.io/api/v1/crates/apimock" || true)
          if [ -z "$RESPONSE" ]; then
            echo "crates.io query failed or was inconclusive; skipping cargo package --workspace this run"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$RESPONSE" | jq -e --arg v "${{ steps.version.outputs.version }}" \
            '.versions // [] | any(.num == $v)' > /dev/null 2>&1; then
            echo "${{ steps.version.outputs.version }} is already on crates.io; skipping cargo package --workspace this run"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ steps.version.outputs.version }} is not yet on crates.io; running cargo package --workspace"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.published.outputs.published != 'true'
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        if: steps.published.outputs.published != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo package --workspace
        if: steps.published.outputs.published != 'true'
        run: cargo package --workspace

  # RFC 039: fails when a crate's public API changes without the
  # checked-in baseline (`crates/<name>/public-api.txt`) being updated
  # in the same commit — a diff the reviewer sees in the PR, not just a
  # tool that compares against the last release. Baselined at the
  # 6.0.0 tag, with zero source changes in between (verified before
  # generating), so this baseline *is* the released 6.0.0 surface.
  #
  # `cargo-public-api` builds rustdoc JSON, which needs a **nightly**
  # toolchain — pinned to a dated one below, bumped deliberately, so
  # this job's flakiness surface is "hasn't been bumped yet" rather
  # than "whatever today's nightly happens to be". This proves nothing
  # about what compiles for users; **the `msrv` job stays the sole
  # authority on what the crates support** — the two toolchains answer
  # different questions and are not meant to agree.
  #
  # `-s` (`--omit blanket-impls`) only. Blanket impls
  # (`impl<T> Any for T`, `impl<T,U> Into<U> for T where U: From<T>`,
  # …) are identical for every public type in every crate regardless of
  # this crate's own code — zero signal, pure noise. Auto-trait impls
  # (`Send`/`Sync`/…) and derived impls (`Clone`/`Debug`/…) are kept
  # despite being noisier: losing either is a real fact about a
  # specific public type changing, which is exactly Goal 1's class of
  # break — even when the trigger is a dependency bump rather than a
  # direct edit here, since `Cargo.lock` changes are already their own
  # deliberate, reviewed commit in this project (the `lockfile` job).
  public-api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      PINNED_NIGHTLY: nightly-2026-08-29
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned nightly toolchain
        run: bash .github/workflows/scripts/install-rust.sh ${{ env.PINNED_NIGHTLY }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-public-api-${{ env.PINNED_NIGHTLY }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-public-api-${{ env.PINNED_NIGHTLY }}-

      # Not version-pinned, matching how `cargo-audit` is installed
      # above (`--locked` for reproducible internal dependency
      # resolution, not a pinned release of the tool itself) — this
      # job's actual flakiness risk is the nightly, addressed above.
      - name: Cache cargo-public-api binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: ${{ runner.os }}-cargo-public-api-bin-${{ env.PINNED_NIGHTLY }}

      - name: Install cargo-public-api
        run: command -v cargo-public-api || cargo +${{ env.PINNED_NIGHTLY }} install cargo-public-api --locked

      - name: Check public API against the checked-in baseline
        run: |
          FAILED=0
          for crate in apimock apimock-config apimock-routing apimock-server; do
            NEW=$(mktemp)
            cargo +${{ env.PINNED_NIGHTLY }} public-api -p "$crate" -s 2>/dev/null > "$NEW"
            if ! diff -u "crates/$crate/public-api.txt" "$NEW"; then
              echo "::error::$crate's public API changed. Update crates/$crate/public-api.txt in this commit to declare the change, or undo the change that caused it."
              FAILED=1
            fi
          done
          exit "$FAILED"

  # Pre-6.0.0 docs audit, E-1: `docs.yaml` only builds (and, in the same
  # job, deploys to GitHub Pages) on push to `main` -- a docs-build
  # break was found only after landing, with the published site already
  # broken. `pull_request` is deliberately not added to `docs.yaml`
  # itself (that would publish unreviewed content the moment a PR
  # opened); this job runs the same `mdbook build` as a read-only gate
  # here instead, where `pull_request` already applies via this
  # workflow's own top-level `on:` trigger. Installs the same
  # mdbook/mdbook-mermaid pair `docs.yaml` does, from the same source,
  # so a build that passes here passes there too. `docs.yaml` itself
  # runs on every push to `main`, whether that's a merged PR (already
  # covered by this job) or a direct commit (RFC 066 § 6) -- so the
  # checks below also see every direct-to-main commit via this
  # workflow's own `push: branches: [main]` trigger, not only PRs.
  #
  # Post-6.0.0 docs-integrity handoff § 1: `mdbook build` alone checks
  # nothing about *content* - two of the three deliberate breaks tried
  # against it produced no error at all (an unclosed code fence; a
  # SUMMARY.md entry for a page that doesn't exist, which mdbook
  # silently stubs rather than failing on). Two checks added for that,
  # each catching what the other structurally cannot:
  #
  # - The stub case is invisible to any link checker - the stub file
  #   really does get created, so the link to it genuinely resolves.
  #   Caught instead by checking whether `mdbook build` touched
  #   anything under `docs/src` at all - on a clean checkout it never
  #   should, so any diff there names exactly the SUMMARY.md entry that
  #   caused it.
  # - The handoff named `mdbook-linkcheck` for broken internal links/
  #   anchors. **Substituted for `lychee`, established rather than
  #   assumed**: `mdbook-linkcheck`'s last release is 2022-10-03, and it
  #   fails outright against this project's mdbook (0.5.4) with
  #   "Unable to parse RenderContext ... missing field `sections`" - a
  #   renderer-protocol incompatibility from years of mdbook changes
  #   since, not a config problem. `lychee` doesn't have this problem
  #   because it isn't an mdbook renderer backend at all - it scans the
  #   *built* HTML directly, so it has no protocol to fall out of sync
  #   with. `--offline` skips external URLs deliberately (an external
  #   site's own availability is not this book's problem to fail a
  #   build over); `--include-fragments` is what actually catches an
  #   anchor like the one that shipped undetected until RFC 065 -
  #   confirmed by reproducing that exact shape of break locally before
  #   writing this job, not assumed from lychee's flag description.

  # Post-6.0.0 docs-integrity handoff § 2: nothing ran `cargo doc`
  # before this, so 16 `rustdoc::broken_intra_doc_links` warnings in
  # `apimock-routing` sat unseen (surfaced only as a side effect of
  # generating RFC 039's public-API baseline, which discards rustdoc's
  # stderr on purpose - those warnings aren't about the public API
  # shape RFC 039 gates). A workspace-wide `cargo doc` swept up 5 more
  # in `apimock-config`/`apimock-server` the routing-only run never
  # touched; all 21 fixed in this same commit (all unambiguous - either
  # a doc-link missing its item's full/relative path, or a link to a
  # crate-private item de-linked rather than made public, since
  # widening visibility is a separate, deliberate decision RFC 039 now
  # exists to make declared, not this task's to make by accident).
  #
  # `RUSTDOCFLAGS="-D warnings"` turns a broken doc link into a build
  # failure rather than a warning nobody reads - a warning nobody reads
  # is exactly how these 21 accumulated. `--no-deps`: this is about
  # this workspace's own doc comments, not third-party crates'.
  rustdoc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Post-6.0.0 docs-integrity handoff § 3: this used to resolve
      # "latest" via an unauthenticated api.github.com call, which
      # rate-limited during unrelated work and failed this required job
      # for a reason invisible in the diff. Pinned instead, exactly
      # like `docs.yaml`'s identical step - see its own comment for the
      # full reasoning; bump both together.
      - name: Install mdBook and extension(s)
        env:
          MDBOOK_VERSION: 0.5.4
          MDBOOK_MERMAID_VERSION: 0.17.1
        run: |
          curl -sL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/
          curl -sL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook-mermaid /usr/local/bin/

      - name: Install lychee
        env:
          LYCHEE_VERSION: 0.24.2
        run: |
          curl -sL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/

      - name: mdbook build
        working-directory: docs
        run: mdbook build

      - name: Check for a silently-stubbed page (SUMMARY.md entry with no source file)
        working-directory: docs
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            echo "::error::mdbook build modified docs/src on a clean checkout - almost always a SUMMARY.md entry naming a page that doesn't exist, which mdbook stubs instead of failing on. Add the missing page, or remove the SUMMARY.md entry."
            git status --porcelain src
            exit 1
          fi

      - name: Check links (internal files and anchors; external links skipped deliberately)
        working-directory: docs
        run: |
          lychee --offline --include-fragments --root-dir "$(pwd)/book" book/
