name: CI

on:
  push:
    # `release/*` matters: v5.19.0 was cut from a branch off the 5.18.0
    # tag (RFC 054), and with `main` alone here that branch had **no CI
    # at all**. The gap was invisible — `gh run list` happily showed a
    # green run, which belonged to `main` at an unrelated commit. Any
    # future branch-cut release gets covered automatically rather than
    # depending on someone noticing which branch a green tick came from.
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:
  # RFC 033: advisories are published against code that hasn't changed,
  # so a check that only runs on push/PR will never see them. Only the
  # `audit` job runs on this trigger — every other job is gated with
  # `if: github.event_name != 'schedule'` so a scheduled run doesn't
  # needlessly re-run fmt/clippy/test/msrv/lockfile on an unchanged tree.
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    if: github.event_name != 'schedule'
    strategy:
      # RFC 061: one platform failing must not cancel the others and
      # hide whether they pass -- the same reason RFC 047 needed this
      # for its own matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Read the pin rather than hardcode it, so a deliberate edit to
      # [workspace.package].rust-version in Cargo.toml is what this job
      # follows — not a second copy of the version that can drift from it.
      - name: Read pinned rust-version
        id: msrv
        run: |
          MSRV=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^[[:space:]]*rust-version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$MSRV" ]; then
            echo "::error::Could not read [workspace.package].rust-version from Cargo.toml"
            exit 1
          fi
          echo "Pinned MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install pinned MSRV toolchain
        run: bash .github/workflows/scripts/install-rust.sh ${{ steps.msrv.outputs.version }}

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-${{ steps.msrv.outputs.version }}-

      # No tests here: dev-dependencies may legitimately require a newer
      # toolchain than the library itself needs to build and check clean.
      - name: cargo check --workspace (MSRV)
        run: cargo check --workspace

  # RFC 033: known-vulnerability audit against the RustSec advisory
  # database, over the committed Cargo.lock. Runs on push/PR/dispatch
  # *and* the weekly schedule above — advisories are published against
  # unchanged code, so this is the one job that must not be excluded
  # from the schedule trigger.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cached separately from the project's own dependency cache above:
      # cargo-audit's binary doesn't depend on this repo's Cargo.lock, so
      # keying it on that would invalidate it every time the lockfile
      # changes for reasons that have nothing to do with cargo-audit
      # itself.
      - name: Cache cargo-audit binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # RFC 033: fails if Cargo.lock doesn't reflect what the manifests
  # currently require -- e.g. a Cargo.toml edit that forgot to
  # regenerate the lockfile. Verified locally that this is NOT the same
  # as "a newer compatible version was published": `cargo update
  # --locked` exits 0 even when dependencies sit behind their latest
  # available version, so this check's result cannot change without a
  # commit to this repo. Unlike `audit`, a weekly re-run would be a
  # guaranteed no-op -- excluded from the schedule trigger for that
  # reason, not merely for symmetry with fmt/clippy/test/msrv.
  lockfile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo update --workspace --locked
        run: cargo update --workspace --locked

  # Post-6.0.0 release-process audit § 3: nothing ran `cargo package`
  # before this, so a packaging problem (an excluded file a crate needs,
  # a manifest error) only ever surfaced during `cargo publish`, after
  # the tag and the draft Release — the same "discovered during a live
  # release" class the npm propagation-wait section of `RELEASING.md`
  # documents for a different job.
  #
  # Gated on the workspace version not already being on crates.io -
  # this is load-bearing, not defensive filler, and was found the hard
  # way. A first version of this job ran `cargo package --workspace`
  # unconditionally, on the reasoning that `--workspace` mode verifies
  # each crate against the *other tarballs this same command just
  # packaged* (cargo's co-packaging temp registry) rather than against
  # crates.io. True for a crate with no workspace-internal dependency
  # (confirmed by deliberately breaking `apimock-routing` itself with a
  # `compile_error!` and watching its own verification fail) - false
  # for one that depends on a sibling crate still at an *already
  # published* version: `apimock-config` depends on `apimock-routing`,
  # and once that exact version string exists on crates.io, cargo
  # resolves it from there instead of from the sibling tarball just
  # packaged alongside it. Reproduced by adding a `pub fn` to
  # `apimock-routing` and calling it from `apimock-config` with the
  # version left at the already-published `6.0.0`: verification failed
  # with "cannot find function" against the *published* crate, proving
  # the unconditional job would turn red on the first ordinary
  # cross-crate change after any release and stay red until the next
  # one - reverted before committing. So: check whether the current
  # `apimock` version (all four crates are always bumped together, so
  # one is representative) is already live on crates.io first, and
  # only run the real packaging build when it is not - true exactly on
  # the release path, between `version.sh --update` and the tag, which
  # is the one place this gate needs to fire.
  #
  # Fails open toward *skipping*, not running, when the crates.io query
  # itself is inconclusive (network hiccup, rate limit, non-2xx) -
  # deliberately, since this job runs on every ordinary push and a
  # false positive here (the exact failure mode above) is worse than an
  # occasional missed check that the very next push re-attempts. No
  # retry loop: unlike `verify-published`/`verify-crates-io` (checking
  # whether something *just* published has propagated), this checks a
  # stable historical fact - it either already answers correctly on the
  # first try or the failure-open default handles it.
  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read workspace version
        id: version
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/                     { in_section=0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              line=$0
              sub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read [workspace.package].version from Cargo.toml"
            exit 1
          fi
          echo "Workspace version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on crates.io
        id: published
        run: |
          # Same User-Agent convention as release-publish.yaml's
          # verify-crates-io - crates.io's API rejects an unidentified
          # request. `apimock` stands in for all four crates (always
          # bumped together by version.sh).
          RESPONSE=$(curl -sf \
            -H "User-Agent: apimock-rs-ci-package-gate (https://github.com/apimokka/apimock-rs)" \
            "https://crates.io/api/v1/crates/apimock" || true)
          if [ -z "$RESPONSE" ]; then
            echo "crates.io query failed or was inconclusive; skipping cargo package --workspace this run"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif echo "$RESPONSE" | jq -e --arg v "${{ steps.version.outputs.version }}" \
            '.versions // [] | any(.num == $v)' > /dev/null 2>&1; then
            echo "${{ steps.version.outputs.version }} is already on crates.io; skipping cargo package --workspace this run"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ steps.version.outputs.version }} is not yet on crates.io; running cargo package --workspace"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.published.outputs.published != 'true'
        run: bash .github/workflows/scripts/install-rust.sh stable

      - name: Cache cargo dependencies and build
        if: steps.published.outputs.published != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo package --workspace
        if: steps.published.outputs.published != 'true'
        run: cargo package --workspace

  # Pre-6.0.0 docs audit, E-1: `docs.yaml` only builds (and, in the same
  # job, deploys to GitHub Pages) on push to `main` -- a docs-build
  # break was found only after landing, with the published site already
  # broken. `pull_request` is deliberately not added to `docs.yaml`
  # itself (that would publish unreviewed content the moment a PR
  # opened); this job runs the same `mdbook build` as a read-only gate
  # here instead, where `pull_request` already applies via this
  # workflow's own top-level `on:` trigger. Installs the same
  # mdbook/mdbook-mermaid pair `docs.yaml` does, from the same source,
  # so a build that passes here passes there too.
  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install mdBook and extension(s)
        run: |
          MDBOOK_URL=$(curl -sL https://api.github.com/repos/rust-lang/mdBook/releases/latest \
          | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu\\.tar\\.gz$")) | .browser_download_url')
          echo mdbook: $MDBOOK_URL
          curl -L $MDBOOK_URL | tar -xz
          sudo mv mdbook /usr/local/bin/
          MDBOOK_MERMAID_URL=$(curl -sL https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest \
          | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu\\.tar\\.gz$")) | .browser_download_url')
          echo mdbook-mermaid: $MDBOOK_MERMAID_URL
          curl -L $MDBOOK_MERMAID_URL | tar -xz
          sudo mv mdbook-mermaid /usr/local/bin/

      - name: mdbook build
        working-directory: docs
        run: mdbook build
