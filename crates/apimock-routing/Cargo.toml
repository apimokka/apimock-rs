[package]
name        = "apimock-routing"
description = "Routing model for apimock: rule sets, request matching, and read-only views for GUI tooling."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
repository.workspace    = true
# RFC 039: the public-API baseline is a CI artefact (diffed against a
# freshly-generated one, never read by any build), not something a
# downstream consumer needs in the published tarball.
exclude = ["public-api.txt"]

[dependencies]
hyper                       = { workspace = true }
indexmap                    = { workspace = true }
regex                       = { workspace = true }
globset                     = { workspace = true }
ignore                      = { workspace = true }
log                         = { workspace = true }
console                     = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
toml                        = { workspace = true }
thiserror                   = { workspace = true }
# RFC 065: `Respond::validate` parses inline `json` and referenced
# `.json`/`.json5` files at load time with the same parser
# `apimock-server`'s `json_response` uses at request time, so load and
# serve agree by construction.
json5                       = { workspace = true }
# RFC 075: percent-decode the incoming request path before dot-segment
# normalisation — see `util/http.rs`'s `percent_decode_url_path`.
percent-encoding            = { workspace = true }

[dev-dependencies]
# RFC 058's `RuleSet::new` tests load real files from a temp directory —
# the on-disk read is part of what's under test (`fs::read_to_string`
# inside `RuleSet::new` itself), not something worth mocking around.
tempfile                    = { workspace = true }
