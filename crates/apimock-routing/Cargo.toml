[package]
name        = "apimock-routing"
description = "Routing model for apimock: rule sets, request matching, and read-only views for GUI tooling."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
repository.workspace    = true

[dependencies]
hyper                       = { workspace = true }
indexmap                    = { workspace = true }
regex                       = { workspace = true }
globset                     = { workspace = true }
ignore                      = { workspace = true }
log                         = { workspace = true }
console                     = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
toml                        = { workspace = true }
thiserror                   = { workspace = true }

[dev-dependencies]
# RFC 058's `RuleSet::new` tests load real files from a temp directory —
# the on-disk read is part of what's under test (`fs::read_to_string`
# inside `RuleSet::new` itself), not something worth mocking around.
tempfile                    = { workspace = true }
