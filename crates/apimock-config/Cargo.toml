[package]
name = "apimock-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Configuration model for apimock: loading, validation, editing, saving."

[dependencies]
# Rule-set parsing is delegated to the routing crate because the rule model
# lives there — the config crate only orchestrates loading.
apimock-routing = { path = "../apimock-routing", version = "5.0.0" }

log = { workspace = true }
console = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
rhai = { workspace = true }

[dev-dependencies]
tempfile = "3"
