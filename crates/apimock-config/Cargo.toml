[package]
name        = "apimock-config"
description = "Configuration model for apimock: loading, validation, editing, saving."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
repository.workspace    = true

[dependencies]
# Rule-set parsing is delegated to the routing crate because the rule model
# lives there — the config crate only orchestrates loading.
apimock-routing             = { workspace = true }

indexmap                    = { workspace = true }

log                         = { workspace = true }
console                     = { workspace = true }
serde                       = { workspace = true }
# `serde_json` is used by `view::Serialize` derive paths on `EditValue`
# variants carrying JSON-ish data, and by `Workspace::snapshot` when
# rendering TOML values as `display_value` strings. Pulled from the
# workspace pin so versions don't drift.
serde_json                  = { workspace = true }
toml                        = { workspace = true }
# Format-preserving parser used only by the save path (RFC 056): mutate
# a parsed document instead of rebuilding one, so comments and key
# order survive a save. `toml` above stays the model's Deserialize
# path and diff.rs's canonical-comparison path — unchanged by this.
toml_edit                   = { workspace = true }
thiserror                   = { workspace = true }
# RFC 065: `Workspace::validate`'s per-node diagnostics mirror
# `apimock_routing::Respond::validate`'s JSON5 checks (inline `json`,
# and a referenced `.json`/`.json5` file's content), so a GUI diagnostic
# and a load-time failure never disagree about the same rule.
json5                        = { workspace = true }
uuid                        = { workspace = true }
# `tempfile` provides `NamedTempFile::persist` for atomic file
# replacement during `Workspace::save`. Same crate the dev-deps already
# use; promoted to a runtime dep here because save() is a runtime API.
tempfile                    = { workspace = true }

[dev-dependencies]
tempfile                    = { workspace = true }
# RFC 060 — property-tests the write path (Workspace::save). Dev-only:
# nothing changes for anyone installing apimock.
proptest                    = { workspace = true }
