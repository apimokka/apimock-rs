[package]
name        = "apimock-server"
description = "HTTP(S) server runtime for apimock: listener loop, request handling, response building."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
repository.workspace    = true

[dependencies]
apimock-config              = { workspace = true }
apimock-routing             = { workspace = true }

tokio                       = { workspace = true }
hyper                       = { workspace = true }
hyper-util                  = { workspace = true }
http-body-util              = { workspace = true }
rustls                      = { workspace = true }
tokio-rustls                = { workspace = true }

log                         = { workspace = true }
console                     = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
json5                       = { workspace = true }
csv                         = { workspace = true }
rhai                        = { workspace = true }
thiserror                   = { workspace = true }

[dev-dependencies]
# The confinement regression tests write real files to disk (including
# a symlink) and check they're refused when they resolve outside a
# directory — the on-disk resolution is what's under test.
tempfile                    = { workspace = true }
