[[rules]]
[rules.when.request]
url_path = { value = "/c/d", op = "starts_with" }
# [rules.when.request.headers]
# user = { value = "user1" }
# [rules.when.request.body.json]
# # `body.json` keys use the routing crate's dotted-path mini-syntax
# # (object keys joined by `.`, numeric segments index arrays).
# # NOT canonical JSONPath — do not write `"$.a.b.c"`.
# "a.b.c" = { value = "d", op = "starts_with" }
# "order.items.0.product_id" = { value = "X" }
# "user.role" = { op = "contains", value = "admin" }
[rules.respond]
# file_path = "test/return.json"
text = "hejhej cd"
