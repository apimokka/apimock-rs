# apimock quickstart rule set.
#
# `apimock --init` copies this file verbatim - it is what a new
# project starts from, so it stays small and every rule here actually
# runs. For JSON/CSV file responses, header and body matching,
# strategies, and more, see the sibling directories under
# crates/apimock/examples/.

[[rules]]
when.request.url_path = "/health"
respond.text = "ok"

[[rules]]
when.request.method = "GET"
when.request.url_path = "/greet"
respond.text = "Hello, world."
